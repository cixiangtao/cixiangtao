<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title description">
	<title id="title">cixiangtao 的移动版彩色个人工作台</title>
	<desc id="description">适合窄屏阅读的关于我、代表项目和最近文章三个纵向经典桌面窗口。</desc>
	<defs>
		<pattern id="desktop-dots" width="8" height="8" patternUnits="userSpaceOnUse">
			<rect width="8" height="8" fill="#6670c9" />
			<rect x="1" y="1" width="2" height="2" fill="#5962b1" />
		</pattern>
		<pattern id="title-lines" width="4" height="4" patternUnits="userSpaceOnUse">
			<rect width="4" height="4" fill="#efeee8" />
			<rect y="1" width="4" height="1" fill="#a7a6a1" />
		</pattern>
		<style>
			.ui { font-family: Geneva, Verdana, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17171b; }
			.data { font-family: Monaco, "SFMono-Regular", Consolas, monospace; fill: #17171b; }
			.window { fill: #fffefa; stroke: #17171b; stroke-width: 2; }
			.title { font-size: 14px; font-weight: 800; }
			.label { font-size: 13px; font-weight: 800; }
			.small { font-size: 11px; font-weight: 700; }
			.muted { fill: #5a5b64; }
			.hairline { stroke: #17171b; stroke-width: 2; }
		</style>
	</defs>

	<rect width="720" height="520" fill="url(#desktop-dots)" />

	<!-- System toolbar -->
	<rect width="720" height="44" fill="#fffefa" />
	<rect y="42" width="720" height="2" fill="#17171b" />
	<rect x="14" y="7" width="30" height="28" fill="#ffda45" stroke="#17171b" stroke-width="2" />
	<rect x="20" y="12" width="18" height="17" fill="#fffefa" stroke="#17171b" stroke-width="2" />
	<rect x="25" y="15" width="8" height="7" fill="#17171b" />
	<rect x="22" y="23" width="14" height="4" fill="#17171b" />
	<text class="ui small" x="59" y="19">当前位置</text>
	<text class="ui label" x="59" y="34" fill="#2442b6">个人工作台</text>
	<circle cx="632" cy="22" r="7" fill="#4fd178" stroke="#17171b" stroke-width="2" />
	<text class="data small" x="646" y="26">在线</text>

	<!-- About window -->
	<rect x="29" y="65" width="672" height="121" fill="#17171b" opacity="0.46" />
	<g transform="translate(23 59)">
		<rect class="window" width="672" height="121" />
		<rect x="1" y="1" width="670" height="28" fill="#efeee8" />
		<rect x="1" y="28" width="670" height="2" fill="#17171b" />
		<rect x="40" y="7" width="224" height="14" fill="url(#title-lines)" />
		<rect x="410" y="7" width="184" height="14" fill="url(#title-lines)" />
		<rect x="11" y="7" width="18" height="15" fill="#ffda45" stroke="#17171b" stroke-width="2" />
		<text class="ui title" x="336" y="20" text-anchor="middle">关于我</text>
		<rect x="604" y="7" width="15" height="15" fill="#ffda45" stroke="#17171b" stroke-width="2" />
		<rect x="622" y="7" width="15" height="15" fill="#43dce6" stroke="#17171b" stroke-width="2" />
		<rect x="640" y="7" width="15" height="15" fill="#ff705e" stroke="#17171b" stroke-width="2" />

		<rect x="17" y="42" width="60" height="60" fill="#ffda45" stroke="#17171b" stroke-width="2" />
		<rect x="25" y="50" width="44" height="44" fill="#fffefa" stroke="#17171b" stroke-width="2" />
		<rect x="38" y="58" width="18" height="15" fill="#17171b" />
		<rect x="32" y="76" width="30" height="12" fill="#17171b" />
		<text class="ui" x="96" y="62" font-size="24" font-weight="900">cixiangtao</text>
		<text class="ui label" x="96" y="84" fill="#2442b6">开源项目 · 技术写作</text>
		<text class="ui" x="96" y="104" font-size="12">持续构建开源项目，也把实践整理成可以复用的工具与文章。</text>
	</g>

	<!-- Projects window -->
	<rect x="29" y="204" width="672" height="118" fill="#17171b" opacity="0.46" />
	<g transform="translate(23 198)">
		<rect class="window" width="672" height="118" />
		<rect x="1" y="1" width="670" height="28" fill="#efeee8" />
		<rect x="1" y="28" width="670" height="2" fill="#17171b" />
		<rect x="40" y="7" width="214" height="14" fill="url(#title-lines)" />
		<rect x="421" y="7" width="173" height="14" fill="url(#title-lines)" />
		<path d="M11 12h8l3-5h9v15H11z" fill="#ffda45" stroke="#17171b" stroke-width="2" />
		<text class="ui title" x="336" y="20" text-anchor="middle">代表项目</text>
		<rect x="604" y="7" width="15" height="15" fill="#ffda45" stroke="#17171b" stroke-width="2" />
		<rect x="622" y="7" width="15" height="15" fill="#43dce6" stroke="#17171b" stroke-width="2" />
		<rect x="640" y="7" width="15" height="15" fill="#ff705e" stroke="#17171b" stroke-width="2" />

		<g transform="translate(15 43)">
			<rect width="30" height="30" fill="#43dce6" stroke="#17171b" stroke-width="2" />
			<path d="M8 7l14 16M22 7L8 23M15 5v21" class="hairline" />
			<text class="ui label" x="40" y="19">codex-skin</text>
		</g>
		<g transform="translate(235 43)">
			<rect width="30" height="30" fill="#ffda45" stroke="#17171b" stroke-width="2" />
			<path d="M8 7l14 16M22 7L8 23M15 5v21" class="hairline" />
			<text class="ui label" x="40" y="19">vite-plugin-locator</text>
		</g>
		<g transform="translate(490 43)">
			<rect width="30" height="30" fill="#ff705e" stroke="#17171b" stroke-width="2" />
			<path d="M8 7l14 16M22 7L8 23M15 5v21" class="hairline" />
			<text class="ui label" x="40" y="19">sticker-ui</text>
		</g>
		<rect x="15" y="86" width="642" height="1" fill="#777871" />
		<text class="data small muted" x="15" y="106">cixiangtao / projects</text>
		<text class="ui small" x="657" y="106" text-anchor="end">查看全部项目 ↗</text>
	</g>

	<!-- Writing window -->
	<rect x="29" y="341" width="672" height="156" fill="#17171b" opacity="0.52" />
	<g transform="translate(23 335)">
		<rect class="window" width="672" height="156" />
		<rect x="1" y="1" width="670" height="28" fill="#efeee8" />
		<rect x="1" y="28" width="670" height="2" fill="#17171b" />
		<rect x="42" y="7" width="212" height="14" fill="url(#title-lines)" />
		<rect x="421" y="7" width="173" height="14" fill="url(#title-lines)" />
		<rect x="11" y="7" width="19" height="16" fill="#fffefa" stroke="#17171b" stroke-width="2" />
		<rect x="15" y="12" width="11" height="2" fill="#17171b" />
		<rect x="15" y="17" width="11" height="2" fill="#43dce6" />
		<text class="ui title" x="336" y="20" text-anchor="middle">最近文章</text>
		<rect x="604" y="7" width="15" height="15" fill="#ffda45" stroke="#17171b" stroke-width="2" />
		<rect x="622" y="7" width="15" height="15" fill="#43dce6" stroke="#17171b" stroke-width="2" />
		<rect x="640" y="7" width="15" height="15" fill="#ff705e" stroke="#17171b" stroke-width="2" />

		<rect x="18" y="47" width="58" height="52" fill="#43dce6" stroke="#17171b" stroke-width="2" />
		<rect x="36" y="57" width="24" height="31" fill="#fffefa" stroke="#17171b" stroke-width="2" />
		<rect x="40" y="66" width="16" height="2" fill="#17171b" />
		<rect x="40" y="73" width="16" height="2" fill="#17171b" />
		<rect x="40" y="80" width="12" height="2" fill="#ff705e" />
		<text class="data small" x="92" y="55" fill="#2442b6">ISSUE 001</text>
		<text class="ui" x="92" y="79" font-size="20" font-weight="900">你好，世界：这个博客如何工作</text>
		<text class="ui label muted" x="92" y="100">GitHub Issues 写作 · Astro 静态构建 · 公开讨论</text>
		<rect x="542" y="61" width="102" height="36" fill="#3156d9" stroke="#17171b" stroke-width="2" />
		<text class="ui small" x="593" y="83" text-anchor="middle" fill="#ffffff">打开文章</text>
		<rect x="1" y="118" width="670" height="37" fill="#efeee8" />
		<rect x="1" y="117" width="670" height="2" fill="#17171b" />
		<text class="ui small muted" x="17" y="141">内容来自带有 blog 标签的 GitHub Issues</text>
		<text class="data small" x="655" y="141" text-anchor="end">ONLINE</text>
	</g>
</svg>
