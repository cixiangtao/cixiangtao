<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
	<title id="title">cixiangtao 的彩色个人工作台</title>
	<desc id="description">经典桌面界面中排列着关于我、代表项目和最近文章三个窗口。</desc>
	<defs>
		<pattern id="desktop-dots" width="8" height="8" patternUnits="userSpaceOnUse">
			<rect width="8" height="8" fill="#6670c9" />
			<rect x="1" y="1" width="2" height="2" fill="#5962b1" />
		</pattern>
		<pattern id="title-lines" width="4" height="4" patternUnits="userSpaceOnUse">
			<rect width="4" height="4" fill="#efeee8" />
			<rect y="1" width="4" height="1" fill="#a7a6a1" />
		</pattern>
		<style>
			.ui { font-family: Geneva, Verdana, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17171b; }
			.data { font-family: Monaco, "SFMono-Regular", Consolas, monospace; fill: #17171b; }
			.title { font-size: 15px; font-weight: 800; }
			.label { font-size: 13px; font-weight: 700; }
			.small { font-size: 11px; font-weight: 700; }
			.muted { fill: #5a5b64; }
			.desktop-label { fill: #fffefa; font-size: 12px; font-weight: 800; paint-order: stroke; stroke: #17171b; stroke-width: 3px; stroke-linejoin: round; }
			.window { fill: #fffefa; stroke: #17171b; stroke-width: 2; }
			.hairline { stroke: #17171b; stroke-width: 2; }
		</style>
	</defs>

	<rect width="1200" height="520" fill="url(#desktop-dots)" />

